description = """
Screenshots from Samo's menu bar. Press ⇧⌘2, drag, and the shot is copied and saved before you let go of the mouse.

- An area, a window (press Space) or the whole screen (⇧⌘1), frozen at the moment you pressed the shortcut
- A magnifier and the size in pixels while you select
- Pin a shot above every window and Space; drag it, resize it, fade it
- Your recent shots in Samo, ready to copy, reveal or pin again

Shots asks macOS for Screen Recording as its own app, so no other extension gains it. Nothing it captures leaves your Mac.
